name: CI

on:
  push:
    branches: [ master, portfolio-hardening ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ApiWebFilme.sln

      - name: Build
        run: dotnet build ApiWebFilme.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test ApiWebFilme.sln
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build container image
        run: docker build --tag golden-raspberry-api:ci .
